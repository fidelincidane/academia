    <div class="header__container">
      <figure class="header__logo">
        <img src="img/common/imagen_header.png" alt="Conquer Blocks">
      </figure>
      <button class="header__hamburger" aria-label="Abrir menú">☰</button>
      <nav class="header__nav">
        <ul class="header__menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="cursos.html">Cursos</a></li>
          <li class="header__more">
            <span class="header__more-trigger">Más ▾</span>

              <li><a href="quienes_somos.html">Quiénes somos</a></li>

    </div>

  <main>
    <section class="section">
      <h1 class="section__title">Contacto</h1>
      <p class="section__text">Contacta con nosotros y resolveremos todas tus dudas.</p>
    </section>

    <section class="section">
      <h2 class="section__title">Formulario de contacto</h2>
      <form action="">
        <p>
          <label for="name">Nombre</label>
          <input type="text" name="name" id="name" required>
        </p>
        <p>
          <label for="email">Email</label>
          <input type="email" name="email" id="email" required>
        </p>
        <p>
          <label for="coment">Comentario / Dudas</label>
          <textarea name="coment" id="coment" cols="30" rows="5"></textarea>
        </p>
        <button class="btn" type="submit">Enviar</button>
        <input type="reset" value="Borrar comentario">
      </form>
    </section>

    <section class="section">
      <h2 class="section__title">Nos puedes encontrar aquí</h2>
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3080.4599334888953!2d-0.46854552506638236!3d39.458937071609654!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd6050393d0d2b9f%3A0x3055e7eae5c4b251!2sCalle%20Vel%C3%A1zquez%2C%2046960%20Aldaia%2C%20Val%C3%A8ncia!5e0!3m2!1ses!2ses!4v1736058737666!5m2!1ses!2ses" width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
  </main>
